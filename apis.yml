description: >-
  Xiaomi is a multinational technology company headquartered in Beijing, China, that designs, develops, and sells a wide
  range of consumer electronics and related software services. The company is known for its smartphones, laptops, smart
  home devices, and other innovative products. Xiaomi offers developer APIs for IoT device control, cloud storage
  (Galaxy FDS), account/identity (Open API), machine learning (Cloud-ML), and AI language models (MiMo).
